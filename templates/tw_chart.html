<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技術分析</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://unpkg.com/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
<style>
html,body{height:100%;}
body{display:flex;flex-direction:column;overflow:hidden;}
.bd-nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(6,10,16,.96);border-bottom:1px solid var(--card-bd);padding:8px 16px;}
.bd-nav .brand{font-size:.95rem;font-weight:900;letter-spacing:1px;color:#fff;padding:4px 10px;background:linear-gradient(135deg,#1a6fd4,#0e4a9a);border-radius:6px;}
.bd-nav .brand span{color:var(--gold);}
.nav-link{padding:4px 10px;border-radius:6px;color:var(--text-mid);font-size:.8rem;font-weight:600;text-decoration:none;}
.nav-link:hover{color:var(--text);background:#0d1828;text-decoration:none;}
.nav-link.active{color:var(--green);background:rgba(0,214,143,.08);}

.main{flex:1;display:flex;min-height:0;}
.chart-col{flex:1;display:flex;flex-direction:column;min-width:0;}
.side{width:230px;border-left:1px solid var(--card-bd);display:flex;flex-direction:column;background:var(--bg2);}
.side-head{padding:8px 10px;font-size:.78rem;color:var(--text-mid);border-bottom:1px solid var(--card-bd);display:flex;justify-content:space-between;gap:6px;}
.side-list{flex:1;overflow-y:auto;}
.side-item{display:flex;justify-content:space-between;padding:5px 10px;font-size:.8rem;cursor:pointer;border-left:3px solid transparent;font-variant-numeric:tabular-nums;}
.side-item:hover{background:#0d1828;}
.side-item.cur{background:rgba(61,142,248,.12);border-left-color:var(--blue);}
.side-item .c{color:var(--gold);margin-right:6px;}
@media(max-width:900px){.side{display:none;}}

.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--card-bd);}
.title{font-size:1.15rem;font-weight:800;}
.title .c{color:var(--gold);margin-right:6px;}
.title .m{font-size:.72rem;color:var(--text-dim);font-weight:600;margin-left:6px;}
.px{font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums;}
.chg{font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums;}
.ohlc{font-size:.78rem;color:var(--text-mid);font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap;}
.up{color:#ff4d4f;} .dn{color:#00c26e;}
.navbtns{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:.78rem;color:var(--text-dim);}
.btn{padding:4px 11px;border-radius:6px;border:1px solid var(--card-bd2);background:#0a1320;color:var(--text-mid);font-size:.8rem;font-weight:700;cursor:pointer;}
.btn:hover{color:var(--text);border-color:var(--blue);}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.star{font-size:1.1rem;cursor:pointer;color:var(--text-dim);}
.star.on{color:var(--gold);}

.tools{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:6px 14px;border-bottom:1px solid var(--card-bd);font-size:.78rem;color:var(--text-mid);}
.grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.grp>b{color:var(--text-dim);font-weight:700;margin-right:2px;}
.tg{padding:2px 8px;border-radius:5px;border:1px solid var(--card-bd2);cursor:pointer;user-select:none;opacity:.45;}
.tg.on{opacity:1;}
.tg i{display:inline-block;width:8px;height:3px;vertical-align:middle;margin-right:4px;border-radius:2px;}
.inp{padding:2px 6px;border-radius:5px;border:1px solid var(--card-bd2);background:#0a1320;color:var(--text);font-size:.78rem;width:46px;}

.chart-box{flex:1;position:relative;min-height:0;}
#chart{position:absolute;inset:0;}
.legend{position:absolute;left:8px;z-index:3;font-size:.74rem;pointer-events:none;font-variant-numeric:tabular-nums;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 90px);text-shadow:0 0 3px #000;}
.legend .n{color:var(--text-dim);}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);z-index:5;background:rgba(6,10,16,.55);font-size:.9rem;}
.foot{font-size:.72rem;color:var(--text-dim);padding:4px 14px;border-top:1px solid var(--card-bd);}
kbd{border:1px solid var(--card-bd2);border-radius:3px;padding:0 4px;font-size:.7rem;}
</style>
</head>
<body>
<nav class="bd-nav">
  <div class="brand">Stock<span>Lens</span></div>
  <a class="nav-link" href="/tw">台股分析</a>
  <a class="nav-link active" href="/tw/board">台股看盤</a>
  <a class="nav-link" href="/screener">策略選股</a>
  <a class="nav-link" href="/logout" style="margin-left:auto">登出</a>
</nav>

<div class="main">
  <div class="chart-col">
    <div class="head">
      <span class="star" id="star" title="加入 / 移除自選股">☆</span>
      <div class="title" id="title">-</div>
      <div class="px" id="px">-</div>
      <div class="chg" id="chg"></div>
      <div class="ohlc" id="ohlc"></div>
      <div class="navbtns">
        <span id="pos"></span>
        <button class="btn" id="prev" title="上一檔（↑ / PageUp / 滾輪上）">▲ 上一檔</button>
        <button class="btn" id="next" title="下一檔（↓ / PageDown / 滾輪下）">▼ 下一檔</button>
      </div>
    </div>
    <div class="tools">
      <div class="grp"><b>週期</b>
        <button class="btn" data-period="60">60分</button><button class="btn" data-period="D">日</button><button class="btn" data-period="W">週</button>
      </div>
      <div class="grp" id="maToggles"><b>均線</b></div>
      <div class="grp" id="mainToggles"></div>
      <div class="grp" id="paneToggles"><b>副圖</b></div>
      <div class="grp"><b>持股均線</b><input class="inp" id="holdN" type="number" min="2" max="60" title="法人持股均線天數（3 或 5，可自訂）"><span>日</span></div>
      <div class="grp"><b>滾輪</b>
        <button class="btn" data-wheel="switch" title="在圖上滾動滑鼠滾輪切換上一檔 / 下一檔">換股</button><button class="btn" data-wheel="zoom" title="在圖上滾動滑鼠滾輪縮放 K 線">縮放</button>
      </div>
    </div>
    <div class="chart-box" id="box">
      <div id="chart"></div>
      <div class="loading" id="loading">載入中…</div>
    </div>
    <div class="foot">
      <kbd>↑</kbd><kbd>↓</kbd> / <kbd>PgUp</kbd><kbd>PgDn</kbd> / 滑鼠滾輪：切換個股・拖曳平移・<kbd>+</kbd><kbd>-</kbd> 縮放・<kbd>Esc</kbd> 回清單。
      法人持股：投信／自營商為累計買賣超(張)，外資以實際持股張數為基準。<span id="srcNote"></span>
    </div>
  </div>
  <aside class="side">
    <div class="side-head"><span id="listLabel">清單</span><a href="/tw/board">回清單</a></div>
    <div class="side-list" id="sideList"></div>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const LC = LightweightCharts;
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
            set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ss = {get(k,d){try{const v=sessionStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}};

const UP = '#ff4d4f', DN = '#00c26e';
const MAS = [[5,'#f0b429'],[10,'#3d8ef8'],[20,'#e040fb'],[60,'#00d68f'],[120,'#ff8a3d'],[240,'#9aa8b8']];
const PANES = [
  ['vol','成交量'], ['kdj','KDJ'],
  ['trust','投信持股'], ['foreign','外資持股'], ['dealer','自營商持股'], ['total','法人持股'],
];
const HOLD_COLOR = {trust:'#f0b429', foreign:'#3d8ef8', dealer:'#e040fb', total:'#00d68f'};

const cfg = Object.assign({period:'D', ma:[5,10,20,60,120,240], boll:true, signals:true,
  panes:['vol','kdj','trust','foreign'], holdN:5, wheel:'switch', bars:120}, ls.get('twChartCfg', {}));
const saveCfg = () => ls.set('twChartCfg', cfg);

let code = new URLSearchParams(location.search).get('code') || '2330';
let nav = ss.get('twNavList', null);
let WATCH = [];
let chart = null, DATA = null, legendFns = [];
const cache = new Map();

async function api(url, opt) {
  const r = await fetch(url, opt);
  if (r.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); throw new Error('未登入'); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const fmt = (v, d=2) => v == null || isNaN(v) ? '-' : Number(v).toLocaleString('zh-TW', {minimumFractionDigits:d, maximumFractionDigits:d});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── 指標 ──
function sma(a, n) {
  const out = new Array(a.length).fill(null); let s = 0, cnt = 0;
  for (let i = 0; i < a.length; i++) {
    if (a[i] == null) { s = 0; cnt = 0; continue; }
    s += a[i]; cnt++;
    if (cnt > n) { s -= a[i - n]; cnt = n; }
    if (cnt === n) out[i] = s / n;
  }
  return out;
}
function boll(c, n=20, k=2) {
  const mid = sma(c, n), up = [], dn = [];
  for (let i = 0; i < c.length; i++) {
    if (mid[i] == null) { up.push(null); dn.push(null); continue; }
    let v = 0; for (let j = i - n + 1; j <= i; j++) v += (c[j] - mid[i]) ** 2;
    const sd = Math.sqrt(v / n); up.push(mid[i] + k * sd); dn.push(mid[i] - k * sd);
  }
  return {mid, up, dn};
}
function kdj(h, l, c, n=9) {
  const K = [], D = [], J = []; let pk = 50, pd = 50;
  for (let i = 0; i < c.length; i++) {
    const s = Math.max(0, i - n + 1);
    const hh = Math.max(...h.slice(s, i + 1)), ll = Math.min(...l.slice(s, i + 1));
    const rsv = hh === ll ? 50 : (c[i] - ll) / (hh - ll) * 100;
    pk = pk * 2 / 3 + rsv / 3; pd = pd * 2 / 3 + pk / 3;
    K.push(pk); D.push(pd); J.push(3 * pk - 2 * pd);
  }
  return {K, D, J};
}
const crossUp = (a, b, i) => i > 0 && a[i-1] != null && b[i-1] != null && a[i] != null && b[i] != null && a[i-1] <= b[i-1] && a[i] > b[i];
const crossDn = (a, b, i) => i > 0 && a[i-1] != null && b[i-1] != null && a[i] != null && b[i] != null && a[i-1] >= b[i-1] && a[i] < b[i];

// 把逐日的法人持股對應到 K 棒（60 分：當日、週：該週最後一個交易日）
function mapDaily(bars, days, vals) {
  const out = new Array(bars.length).fill(null);
  if (!days.length) return out;
  let j = -1;
  for (let i = 0; i < bars.length; i++) {
    const end = cfg.period === 'W' ? (i + 1 < bars.length ? bars[i+1].day : '9999') : bars[i].day;
    const strict = cfg.period === 'W';
    while (j + 1 < days.length && (strict ? days[j+1] < end : days[j+1] <= end)) j++;
    if (j >= 0 && (cfg.period === 'W' || days[j] === bars[i].day)) out[i] = vals[j];
  }
  return out;
}

// ── 畫圖 ──
function line(color, width=1, extra={}) {
  return Object.assign({color, lineWidth: width, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false}, extra);
}
const toSeries = (bars, arr) => bars.map((b, i) => arr[i] == null ? {time: b.time} : {time: b.time, value: arr[i]});

function build() {
  const box = $('#chart');
  let range = null;
  if (chart) { range = chart.timeScale().getVisibleLogicalRange(); chart.remove(); }
  legendFns = [];
  document.querySelectorAll('.legend').forEach(e => e.remove());
  const bars = DATA.bars;
  if (!bars.length) { $('#loading').textContent = '查無 K 線資料'; $('#loading').style.display = 'flex'; return; }
  chart = LC.createChart(box, {
    autoSize: true,
    layout: {background: {color: '#060a10'}, textColor: '#7a9ab8', fontSize: 11, attributionLogo: false,
             panes: {separatorColor: '#1c2e48', separatorHoverColor: 'rgba(61,142,248,.25)'}},
    grid: {vertLines: {color: 'rgba(28,46,72,.35)'}, horzLines: {color: 'rgba(28,46,72,.35)'}},
    crosshair: {mode: LC.CrosshairMode.Normal},
    rightPriceScale: {borderColor: '#1c2e48'},
    timeScale: {borderColor: '#1c2e48', timeVisible: cfg.period === '60', secondsVisible: false, rightOffset: 4},
    handleScroll: {mouseWheel: cfg.wheel === 'zoom', pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false},
    handleScale: {mouseWheel: cfg.wheel === 'zoom', pinch: true, axisPressedMouseMove: true},
    localization: {locale: 'zh-TW', priceFormatter: p => Math.abs(p) >= 1000 ? p.toFixed(0) : p.toFixed(2)},
  });
  const O = bars.map(b => b.open), H = bars.map(b => b.high), L = bars.map(b => b.low), C = bars.map(b => b.close), V = bars.map(b => b.volume);
  const fmtTime = t => typeof t === 'number' ? new Date(t * 1000).toISOString().slice(0, 16).replace('T', ' ') : t;

  // 主圖
  const candle = chart.addSeries(LC.CandlestickSeries, {upColor: UP, downColor: DN, borderUpColor: UP, borderDownColor: DN, wickUpColor: UP, wickDownColor: DN, priceLineVisible: true});
  candle.setData(bars.map(b => ({time: b.time, open: b.open, high: b.high, low: b.low, close: b.close})));
  const maVals = {};
  MAS.forEach(([n, color]) => {
    if (!cfg.ma.includes(n)) return;
    maVals[n] = sma(C, n);
    chart.addSeries(LC.LineSeries, line(color)).setData(toSeries(bars, maVals[n]));
  });
  let bb = null;
  if (cfg.boll) {
    bb = boll(C);
    const o = {lineStyle: LC.LineStyle.Dashed};
    chart.addSeries(LC.LineSeries, line('#8fa3bf', 1, o)).setData(toSeries(bars, bb.up));
    chart.addSeries(LC.LineSeries, line('#8fa3bf', 1, {lineStyle: LC.LineStyle.Dotted})).setData(toSeries(bars, bb.mid));
    chart.addSeries(LC.LineSeries, line('#8fa3bf', 1, o)).setData(toSeries(bars, bb.dn));
  }
  addLegend(0, i => {
    const b = bars[i], prev = i > 0 ? bars[i-1].close : b.open, cc = b.close >= prev ? 'up' : 'dn';
    return `<span class="n">${fmtTime(b.time)}</span>` +
      `<span>開 <b class="${cc}">${fmt(b.open)}</b></span><span>高 <b class="${cc}">${fmt(b.high)}</b></span>` +
      `<span>低 <b class="${cc}">${fmt(b.low)}</b></span><span>收 <b class="${cc}">${fmt(b.close)}</b></span>` +
      MAS.filter(([n]) => maVals[n]).map(([n, c]) => `<span style="color:${c}">MA${n} ${fmt(maVals[n][i])}</span>`).join('') +
      (bb ? `<span style="color:#8fa3bf">BOLL ${fmt(bb.up[i])} / ${fmt(bb.mid[i])} / ${fmt(bb.dn[i])}</span>` : '');
  });

  // 副圖
  let paneIdx = 0, kd = null;
  const markers = [];
  const inst = DATA.inst;
  for (const [key, label] of PANES) {
    if (!cfg.panes.includes(key)) continue;
    paneIdx++;
    const p = paneIdx;
    if (key === 'vol') {
      const vs = chart.addSeries(LC.HistogramSeries, {priceFormat: {type: 'volume'}, priceLineVisible: false, lastValueVisible: true}, p);
      vs.setData(bars.map((b, i) => ({time: b.time, value: b.volume, color: (b.close >= (i ? bars[i-1].close : b.open)) ? 'rgba(255,77,79,.6)' : 'rgba(0,194,110,.6)'})));
      const v5 = sma(V, 5), v20 = sma(V, 20);
      chart.addSeries(LC.LineSeries, line('#f0b429'), p).setData(toSeries(bars, v5));
      chart.addSeries(LC.LineSeries, line('#3d8ef8'), p).setData(toSeries(bars, v20));
      addLegend(p, i => `<span class="n">成交量(張)</span><span>${fmt(V[i], 0)}</span><span style="color:#f0b429">MA5 ${fmt(v5[i], 0)}</span><span style="color:#3d8ef8">MA20 ${fmt(v20[i], 0)}</span>`);
    } else if (key === 'kdj') {
      kd = kd || kdj(H, L, C);
      chart.addSeries(LC.LineSeries, line('#f0b429', 1.5), p).setData(toSeries(bars, kd.K));
      chart.addSeries(LC.LineSeries, line('#3d8ef8', 1.5), p).setData(toSeries(bars, kd.D));
      const js = chart.addSeries(LC.LineSeries, line('#e040fb'), p);
      js.setData(toSeries(bars, kd.J));
      js.createPriceLine({price: 80, color: 'rgba(255,77,79,.35)', lineStyle: LC.LineStyle.Dashed, axisLabelVisible: false});
      js.createPriceLine({price: 20, color: 'rgba(0,194,110,.35)', lineStyle: LC.LineStyle.Dashed, axisLabelVisible: false});
      addLegend(p, i => `<span class="n">KDJ(9,3,3)</span><span style="color:#f0b429">K ${fmt(kd.K[i])}</span><span style="color:#3d8ef8">D ${fmt(kd.D[i])}</span><span style="color:#e040fb">J ${fmt(kd.J[i])}</span>`);
    } else {
      const hold = inst.hold[key], maDaily = sma(hold, cfg.holdN);
      const h = mapDaily(bars, inst.days, hold), m = mapDaily(bars, inst.days, maDaily), net = mapDaily(bars, inst.days, inst.net[key]);
      const color = HOLD_COLOR[key];
      chart.addSeries(LC.HistogramSeries, {priceScaleId: 'net' + key, priceLineVisible: false, lastValueVisible: false}, p)
        .setData(bars.map((b, i) => net[i] == null || cfg.period === 'W' ? {time: b.time} : {time: b.time, value: net[i], color: net[i] >= 0 ? 'rgba(255,77,79,.22)' : 'rgba(0,194,110,.22)'}));
      chart.priceScale('net' + key, p).applyOptions({scaleMargins: {top: 0.55, bottom: 0}, visible: false});
      chart.addSeries(LC.LineSeries, line(color, 2, {lastValueVisible: true, priceFormat: {type: 'volume'}}), p).setData(toSeries(bars, h));
      chart.addSeries(LC.LineSeries, line('#c8d8ec', 1, {lineStyle: LC.LineStyle.Dashed, priceFormat: {type: 'volume'}}), p).setData(toSeries(bars, m));
      const nm = key === 'foreign' && !inst.foreign_anchor ? label + '(累計買賣超)' : label;
      addLegend(p, i => `<span class="n">${nm}(張)</span><span style="color:${color}">${fmt(h[i], 0)}</span><span>MA${cfg.holdN} ${fmt(m[i], 0)}</span>` +
        (net[i] != null && cfg.period !== 'W' ? `<span class="${net[i] >= 0 ? 'up' : 'dn'}">當日 ${net[i] >= 0 ? '+' : ''}${fmt(net[i], 0)}</span>` : ''));
      // 盤後選股訊號：持股穿越均線且 KD 同日交叉（日線）
      if (cfg.signals && cfg.period === 'D') {
        kd = kd || kdj(H, L, C);
        for (let i = 1; i < bars.length; i++) {
          if (crossUp(h, m, i) && crossUp(kd.K, kd.D, i))
            markers.push({time: bars[i].time, position: 'belowBar', color: UP, shape: 'arrowUp', text: label.slice(0, 2) + 'B'});
          else if (crossDn(h, m, i) && crossDn(kd.K, kd.D, i))
            markers.push({time: bars[i].time, position: 'aboveBar', color: DN, shape: 'arrowDown', text: label.slice(0, 2) + 'S'});
        }
      }
    }
  }
  if (markers.length) {
    markers.sort((a, b) => (a.time > b.time) - (a.time < b.time));
    LC.createSeriesMarkers(candle, markers);
  }

  // 版面：主圖較高，副圖平均
  const panes = chart.panes();
  panes.forEach((pn, i) => pn.setStretchFactor(i === 0 ? Math.max(2, panes.length * 0.9) : 1));

  const n = bars.length;
  if (range && cfg._keepRange) chart.timeScale().setVisibleLogicalRange(range);
  else chart.timeScale().setVisibleLogicalRange({from: Math.max(0, n - cfg.bars), to: n + 3});
  cfg._keepRange = false;
  chart.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (r) { cfg.bars = Math.max(20, Math.round(r.to - r.from - 3)); saveCfg(); }
  });
  chart.subscribeCrosshairMove(param => {
    const i = param.logical != null && param.time != null ? Math.round(param.logical) : n - 1;
    showLegend(Math.min(n - 1, Math.max(0, i)));
  });
  requestAnimationFrame(() => { placeLegends(); showLegend(n - 1); });
}

function addLegend(pane, fn) {
  const el = document.createElement('div');
  el.className = 'legend'; el.dataset.pane = pane;
  $('#box').appendChild(el);
  legendFns.push([el, fn]);
}
function showLegend(i) { legendFns.forEach(([el, fn]) => el.innerHTML = fn(i)); }
function placeLegends() {
  if (!chart) return;
  const top0 = $('#box').getBoundingClientRect().top;
  const panes = chart.panes();
  legendFns.forEach(([el]) => {
    const pe = panes[+el.dataset.pane]?.getHTMLElement();
    if (pe) el.style.top = (pe.getBoundingClientRect().top - top0 + 4) + 'px';
  });
}
new ResizeObserver(() => requestAnimationFrame(placeLegends)).observe($('#box'));
document.addEventListener('mouseup', () => setTimeout(placeLegends, 30));   // 拖曳副圖分隔線後

// ── 資料 ──
function fetchChart(c) {
  const key = c + ':' + cfg.period;
  if (!cache.has(key)) {
    const p = api(`/api/tw/board/chart/${encodeURIComponent(c)}?period=${cfg.period}`);
    p.catch(() => cache.delete(key));
    cache.set(key, p);
    if (cache.size > 40) cache.delete(cache.keys().next().value);
  }
  return cache.get(key);
}

let loadSeq = 0;
async function load() {
  const seq = ++loadSeq;
  $('#loading').textContent = '載入中…'; $('#loading').style.display = 'flex';
  history.replaceState(null, '', '/tw/board/chart?code=' + encodeURIComponent(code));
  renderNav();
  loadQuote();
  try {
    const d = await fetchChart(code);
    if (seq !== loadSeq) return;
    DATA = d;
    document.title = `${d.code} ${d.name} — 技術分析`;
    $('#srcNote').textContent = d.source === 'db' ? '（K 線來源：證交所／櫃買中心日資料）' : '';
    build();
    $('#loading').style.display = 'none';
  } catch (e) {
    if (seq !== loadSeq) return;
    $('#loading').textContent = '載入失敗：' + e.message;
  }
  // 預先載入下一檔，讓連續瀏覽更順
  const ix = navIndex();
  if (ix >= 0 && ix + 1 < nav.list.length) fetchChart(nav.list[ix + 1][0]).catch(() => {});
}

let quoteTimer = null;
async function loadQuote() {
  clearTimeout(quoteTimer);
  const c = code;
  try {
    const q = await api('/api/tw/board/quote/' + encodeURIComponent(c));
    if (c !== code) return;
    const cc = q.chg > 0 ? 'up' : q.chg < 0 ? 'dn' : '';
    $('#title').innerHTML = `<span class="c">${esc(q.code)}</span>${esc(q.name)}<span class="m">${q.market === 'TSE' ? '上市' : '上櫃'}・${esc(q.industry || '')}</span>`;
    $('#px').className = 'px ' + cc; $('#px').textContent = fmt(q.price);
    $('#chg').className = 'chg ' + cc;
    $('#chg').textContent = q.chg == null ? '' : `${q.chg > 0 ? '▲' : q.chg < 0 ? '▼' : ''}${fmt(Math.abs(q.chg))} (${q.chg_pct > 0 ? '+' : ''}${fmt(q.chg_pct)}%)`;
    $('#ohlc').innerHTML = `<span>開 ${fmt(q.open)}</span><span>高 ${fmt(q.high)}</span><span>低 ${fmt(q.low)}</span><span>昨收 ${fmt(q.prev)}</span><span>量 ${fmt(q.volume, 0)} 張</span>` +
      `<span>${q.realtime ? '<b class="up">● 即時</b> ' + esc(q.time || '') : esc(q.date || '')}</span>`;
    if (q.realtime) quoteTimer = setTimeout(loadQuote, 20000);
  } catch (e) {
    $('#title').textContent = code;
  }
}

// ── 清單 / 換股 ──
function navIndex() { return nav ? nav.list.findIndex(x => x[0] === code) : -1; }
function renderNav() {
  if (!nav || navIndex() < 0) {
    nav = {label: '自選股', list: WATCH.map(c => [c, c])};
    if (navIndex() < 0) nav.list.unshift([code, code]);
  }
  const ix = navIndex();
  $('#pos').textContent = `${ix + 1} / ${nav.list.length}`;
  $('#listLabel').textContent = `${nav.label}（${nav.list.length}）`;
  $('#prev').disabled = ix <= 0; $('#next').disabled = ix >= nav.list.length - 1;
  const wset = new Set(WATCH);
  $('#star').textContent = wset.has(code) ? '★' : '☆'; $('#star').classList.toggle('on', wset.has(code));
  const sl = $('#sideList');
  if (sl.dataset.key !== nav.label + nav.list.length) {
    sl.dataset.key = nav.label + nav.list.length;
    sl.innerHTML = nav.list.map(([c, n]) => `<div class="side-item" data-c="${esc(c)}"><span><span class="c">${esc(c)}</span>${esc(n)}</span></div>`).join('');
  }
  sl.querySelectorAll('.side-item.cur').forEach(e => e.classList.remove('cur'));
  const cur = sl.querySelector(`[data-c="${CSS.escape(code)}"]`);
  if (cur) { cur.classList.add('cur'); cur.scrollIntoView({block: 'nearest'}); }
}
function go(step) {
  const ix = navIndex(), j = ix + step;
  if (ix < 0 || j < 0 || j >= nav.list.length) return;
  code = nav.list[j][0];
  load();
}
$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#sideList').onclick = e => { const it = e.target.closest('.side-item'); if (it) { code = it.dataset.c; load(); } };

let wheelAcc = 0, wheelLock = 0;
$('#box').addEventListener('wheel', e => {
  if (cfg.wheel !== 'switch') return;
  e.preventDefault();
  if (Date.now() < wheelLock) return;
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) >= 60) { go(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; wheelLock = Date.now() + 250; }
}, {passive: false});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  else if (e.key === 'Escape') location.href = '/tw/board';
  else if ((e.key === '+' || e.key === '=' || e.key === '-') && chart) {
    const ts = chart.timeScale(), r = ts.getVisibleLogicalRange(); if (!r) return;
    const w = r.to - r.from, nw = e.key === '-' ? w * 1.25 : w * 0.8;
    ts.setVisibleLogicalRange({from: r.to - nw, to: r.to});
  }
});

$('#star').onclick = async () => {
  const on = WATCH.includes(code);
  WATCH = await api('/api/tw/board/watchlist', {method: on ? 'DELETE' : 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({code})});
  renderNav();
};

// ── 工具列 ──
function renderTools() {
  document.querySelectorAll('[data-period]').forEach(b => b.classList.toggle('on', b.dataset.period === cfg.period));
  document.querySelectorAll('[data-wheel]').forEach(b => b.classList.toggle('on', b.dataset.wheel === cfg.wheel));
  $('#maToggles').innerHTML = '<b>均線</b>' + MAS.map(([n, c]) => `<span class="tg${cfg.ma.includes(n) ? ' on' : ''}" data-ma="${n}"><i style="background:${c}"></i>MA${n}</span>`).join('');
  $('#mainToggles').innerHTML = `<span class="tg${cfg.boll ? ' on' : ''}" data-flag="boll"><i style="background:#8fa3bf"></i>布林</span>` +
    `<span class="tg${cfg.signals ? ' on' : ''}" data-flag="signals" title="在日 K 上標示：法人持股穿越均線且 KD 同日交叉">選股訊號</span>`;
  $('#paneToggles').innerHTML = '<b>副圖</b>' + PANES.map(([k, l]) => `<span class="tg${cfg.panes.includes(k) ? ' on' : ''}" data-pane="${k}">${HOLD_COLOR[k] ? `<i style="background:${HOLD_COLOR[k]}"></i>` : ''}${l}</span>`).join('');
  $('#holdN').value = cfg.holdN;
}
document.querySelector('.tools').addEventListener('click', e => {
  const t = e.target.closest('[data-period],[data-wheel],[data-ma],[data-flag],[data-pane]');
  if (!t) return;
  if (t.dataset.period) { cfg.period = t.dataset.period; saveCfg(); renderTools(); return load(); }
  if (t.dataset.wheel) { cfg.wheel = t.dataset.wheel; }
  if (t.dataset.ma) { const n = +t.dataset.ma; cfg.ma = cfg.ma.includes(n) ? cfg.ma.filter(x => x !== n) : cfg.ma.concat(n); }
  if (t.dataset.flag) cfg[t.dataset.flag] = !cfg[t.dataset.flag];
  if (t.dataset.pane) { const k = t.dataset.pane; cfg.panes = cfg.panes.includes(k) ? cfg.panes.filter(x => x !== k) : PANES.map(p => p[0]).filter(x => x === k || cfg.panes.includes(x)); }
  saveCfg(); renderTools();
  if (DATA) { cfg._keepRange = true; build(); }
});
$('#holdN').onchange = e => {
  cfg.holdN = Math.max(2, Math.min(60, +e.target.value || 5)); saveCfg(); renderTools();
  if (DATA) { cfg._keepRange = true; build(); }
};

(async () => {
  renderTools();
  try { WATCH = await api('/api/tw/board/watchlist'); } catch (e) {}
  load();
})();
</script>
</body>
</html>
