<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技術分析</title>
<link rel="stylesheet" href="/static/css/style.css?v=5">
{% include "_head.html" %}
<script src="https://unpkg.com/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
<style>
html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
.main { flex: 1; display: flex; min-height: 0; gap: 14px; padding: 14px; }
.chart-col { flex: 1; display: flex; flex-direction: column; min-width: 0; gap: 12px; }
.card2 { background: var(--card-bg); border: 1px solid var(--card-bd); border-radius: 18px; box-shadow: var(--shadow); }

/* 報價列 */
.head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 14px 18px; }
.star { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: var(--text-dim);
        background: var(--overlay-1); border: 1px solid var(--line); transition: all .15s; }
.star:hover { color: var(--gold); border-color: var(--card-bd2); }
.star.on { color: var(--gold); background: rgba(245,196,81,.12); border-color: rgba(245,196,81,.35); }
.star svg { width: 18px; height: 18px; }
.ident .code { font-family: 'JetBrains Mono', monospace; font-size: .78rem; font-weight: 600; color: var(--gold); letter-spacing: .04em; }
.ident .name { font-family: 'Space Grotesk', 'Noto Sans TC', sans-serif; font-size: 1.45rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.ident .meta { font-size: .72rem; color: var(--text-dim); margin-left: 6px; font-weight: 500; }
.px { font-family: 'JetBrains Mono', monospace; font-size: 2.1rem; font-weight: 700; letter-spacing: -.04em; line-height: 1; }
.chg { display: inline-flex; flex-direction: column; gap: 3px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: .86rem; }
.chg .pill { padding: 3px 9px; border-radius: 8px; text-align: center; }
.chg.up .pill { background: rgba(255,77,106,.13); } .chg.dn .pill { background: rgba(18,209,142,.13); }
.ohlc { display: grid; grid-template-columns: repeat(3, auto); gap: 2px 18px; font-size: .74rem; color: var(--text-dim); }
.ohlc b { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--text); margin-left: 6px; }
.rtflag { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 700; color: var(--red); letter-spacing: .06em; }
.rtflag i { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: ping 1.8s infinite; }
.up { color: var(--red); } .dn { color: var(--green); }
.navbtns { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.pos { font-family: 'JetBrains Mono', monospace; font-size: .78rem; color: var(--text-dim); padding: 0 6px; }
.nbtn { height: 38px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border-radius: 11px; border: 1px solid var(--card-bd2);
        background: var(--surface-1); color: var(--text); font-size: .82rem; font-weight: 600; cursor: pointer; transition: all .15s; }
.nbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.nbtn:disabled { opacity: .35; cursor: default; }
.nbtn svg { width: 15px; height: 15px; }

/* 工具列 */
.tools { display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; padding: 10px 16px; font-size: .78rem; color: var(--text-mid); }
.grp { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.grp > b { font-size: .66rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); margin-right: 4px; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-1); border: 1px solid var(--card-bd); }
.seg button { border: none; background: none; color: var(--text-mid); padding: 5px 12px; border-radius: 7px; font-size: .78rem; font-weight: 600; cursor: pointer; transition: all .15s; }
.seg button.on { background: var(--accent-grad); color: #fff; box-shadow: var(--glow); }
.tg { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 8px; border: 1px solid var(--card-bd); cursor: pointer; user-select: none;
      color: var(--text-dim); transition: all .15s; font-size: .76rem; font-weight: 600; }
.tg:hover { color: var(--text); }
.tg.on { color: var(--text); background: var(--overlay-2); border-color: var(--card-bd2); }
.tg i { display: inline-block; width: 9px; height: 3px; border-radius: 3px; opacity: .35; }
.tg.on i { opacity: 1; }
.inp { width: 52px; height: 28px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--card-bd); background: var(--surface-1); color: var(--text);
       font-family: 'JetBrains Mono', monospace; font-size: .8rem; }

/* 圖表 */
.chart-box { flex: 1; position: relative; min-height: 0; overflow: hidden; }
#chart { position: absolute; inset: 6px 4px 4px 4px; }
.legend { position: absolute; left: 14px; z-index: 3; font-size: .72rem; pointer-events: none; font-family: 'JetBrains Mono', monospace;
          display: flex; gap: 12px; flex-wrap: wrap; max-width: calc(100% - 100px); }
.legend .n { color: var(--text-dim); font-family: 'Inter', 'Noto Sans TC', sans-serif; font-weight: 600; }
.loading { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; color: var(--text-dim);
           z-index: 5; background: var(--scrim); backdrop-filter: blur(3px); font-size: .88rem; }
.loading::before { content: ''; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--card-bd2); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.foot { font-size: .72rem; color: var(--text-dim); padding: 0 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
kbd { font-family: 'JetBrains Mono', monospace; border: 1px solid var(--card-bd2); border-radius: 5px; padding: 0 5px; font-size: .68rem; }

/* 側邊清單 */
.side { width: 250px; display: flex; flex-direction: column; overflow: hidden; }
.side-head { padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); }
.side-head b { font-size: .86rem; }
.side-head span { font-family: 'JetBrains Mono', monospace; font-size: .72rem; color: var(--text-dim); }
.side-head a { font-size: .76rem; }
.side-list { flex: 1; overflow-y: auto; padding: 6px; }
.side-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; font-size: .84rem; cursor: pointer; border-radius: 10px; transition: background .12s; }
.side-item:hover { background: var(--overlay-1); }
.side-item.cur { background: rgba(109,93,252,.14); box-shadow: inset 3px 0 0 var(--accent); }
.side-item .c { font-family: 'JetBrains Mono', monospace; font-size: .76rem; color: var(--gold); width: 48px; flex-shrink: 0; }
.side-item .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 1000px) { .side { display: none; } .main { padding: 8px; } .ohlc { display: none; } }
/* 嵌入台股分析頁時：只留工具列與圖表 */
body.embed .appbar, body.embed .side, body.embed .head, body.embed .foot, body.embed .wheel-grp { display: none !important; }
body.embed .main { padding: 0; }
body.embed .card2 { border-radius: 12px; box-shadow: none; }
body.embed::before { display: none; }
</style>
</head>
<body>
{% include "_appbar.html" %}

<div class="main">
  <div class="chart-col">
    <div class="head card2">
      <span class="star" id="star" title="加入 / 移除自選股"></span>
      <div class="ident" id="title"><div class="code">-</div><div class="name">載入中</div></div>
      <div class="px" id="px">-</div>
      <div class="chg" id="chg"></div>
      <div class="ohlc" id="ohlc"></div>
      <div class="navbtns">
        <span class="pos" id="pos"></span>
        <button class="nbtn" id="prev" title="上一檔（↑ / PageUp / 滾輪上）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>上一檔</button>
        <button class="nbtn" id="next" title="下一檔（↓ / PageDown / 滾輪下）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>下一檔</button>
      </div>
    </div>
    <div class="tools card2">
      <div class="grp"><b>週期</b><span class="seg"><button data-period="1">1分</button><button data-period="15">15分</button><button data-period="60">60分</button><button data-period="D">日</button><button data-period="W">週</button><button data-period="M">月</button></span></div>
      <div class="grp" id="maToggles"></div>
      <div class="grp" id="mainToggles"></div>
      <div class="grp" id="paneToggles"></div>
      <div class="grp"><b>持股均線</b><input class="inp" id="holdN" type="number" min="2" max="60" title="法人持股均線天數（3 或 5，可自訂）"><span>日</span></div>
      <div class="grp wheel-grp"><b>滾輪</b><span class="seg"><button data-wheel="switch" title="在圖上滾動滑鼠滾輪切換上一檔 / 下一檔">換股</button><button data-wheel="zoom" title="在圖上滾動滑鼠滾輪縮放 K 線">縮放</button></span></div>
    </div>
    <div class="chart-box card2" id="box">
      <div id="chart"></div>
      <div class="loading" id="loading">載入中…</div>
    </div>
    <div class="foot">
      <kbd>↑</kbd><kbd>↓</kbd><kbd>PgUp</kbd><kbd>PgDn</kbd> 或滑鼠滾輪切換個股・拖曳平移・<kbd>+</kbd><kbd>-</kbd> 縮放・<kbd>Esc</kbd> 回清單・
      法人持股：投信／自營商為累計買賣超(張)，外資以實際持股張數為基準。<span id="srcNote"></span>
    </div>
  </div>
  <aside class="side card2">
    <div class="side-head"><div><b id="listLabel">清單</b> <span id="listCount"></span></div><a href="/tw/board">回清單</a></div>
    <div class="side-list" id="sideList"></div>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const LC = LightweightCharts;
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
            set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ss = {get(k,d){try{const v=sessionStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}};

// 顏色跟著主題（亮色 / 暗色）
let UP, DN;
const alpha = (c, a) => {
  const m = c.match(/^#([0-9a-f]{6})$/i);
  if (!m) return c;
  const n = parseInt(m[1], 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};
// 亮色背景用較深的線色，暗色背景用較亮的線色
const PALETTE = {
  dark:  {ma: ['#f0b429','#5b9bff','#e879f9','#2ee6a6','#ff8a3d','#94a3b8'], hold: ['#f0b429','#5b9bff','#e879f9','#2ee6a6'], kdj: ['#f0b429','#5b9bff','#e879f9']},
  light: {ma: ['#c98a00','#2563eb','#c026d3','#059669','#ea580c','#64748b'], hold: ['#c98a00','#2563eb','#c026d3','#059669'], kdj: ['#c98a00','#2563eb','#c026d3']},
};
function themeColors() {
  UP = Theme.css('--red'); DN = Theme.css('--green');
  const pal = PALETTE[Theme.mode()] || PALETTE.dark;
  MAS = [5, 10, 20, 60, 120, 240].map((n, i) => [n, pal.ma[i]]);
  HOLD_COLOR = {trust: pal.hold[0], foreign: pal.hold[1], dealer: pal.hold[2], total: pal.hold[3]};
  KDJ_C = pal.kdj;
}
themeColors();
var MAS;
const PANES = [
  ['vol','成交量'], ['kdj','KDJ'], ['rsi','RSI'], ['macd','MACD'],
  ['trust','投信持股'], ['foreign','外資持股'], ['dealer','自營商持股'], ['total','法人持股'],
];
var HOLD_COLOR, KDJ_C;

const QS = new URLSearchParams(location.search);
const EMBED = QS.get('embed') === '1';
const CFG_KEY = EMBED ? 'twChartCfgEmbed' : 'twChartCfg';
const INTRADAY = ['1', '15', '60'];
const cfg = Object.assign({period:'D', ma:[5,10,20,60,120,240], boll:true, signals:true,
  panes:['vol','kdj','trust','foreign'], holdN:5, wheel: EMBED ? 'zoom' : 'switch', bars:120}, ls.get(CFG_KEY, {}));
if (EMBED) { cfg.wheel = 'zoom'; document.body.classList.add('embed'); }
if (QS.get('period') && ['1','15','60','D','W','M'].includes(QS.get('period'))) cfg.period = QS.get('period');
const saveCfg = () => ls.set(CFG_KEY, cfg);

let code = QS.get('code') || '2330';
const INDEX_CODES = ['TAIEX', 'TPEX'];
const IS_INDEX = () => INDEX_CODES.includes(code);
let nav = ss.get('twNavList', null);
let WATCH = [], WGROUPS = [], WNAMES = {};
function setWatch(p) { WGROUPS = p.groups || []; WNAMES = p.names || {}; WATCH = [...new Set(WGROUPS.flatMap(g => g.codes))]; }
let chart = null, DATA = null, legendFns = [];
const cache = new Map();

async function api(url, opt) {
  const r = await fetch(url, opt);
  if (r.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); throw new Error('未登入'); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const fmt = (v, d=2) => v == null || isNaN(v) ? '-' : Number(v).toLocaleString('zh-TW', {minimumFractionDigits:d, maximumFractionDigits:d});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── 指標 ──
function sma(a, n) {
  const out = new Array(a.length).fill(null); let s = 0, cnt = 0;
  for (let i = 0; i < a.length; i++) {
    if (a[i] == null) { s = 0; cnt = 0; continue; }
    s += a[i]; cnt++;
    if (cnt > n) { s -= a[i - n]; cnt = n; }
    if (cnt === n) out[i] = s / n;
  }
  return out;
}
function boll(c, n=20, k=2) {
  const mid = sma(c, n), up = [], dn = [];
  for (let i = 0; i < c.length; i++) {
    if (mid[i] == null) { up.push(null); dn.push(null); continue; }
    let v = 0; for (let j = i - n + 1; j <= i; j++) v += (c[j] - mid[i]) ** 2;
    const sd = Math.sqrt(v / n); up.push(mid[i] + k * sd); dn.push(mid[i] - k * sd);
  }
  return {mid, up, dn};
}
function kdj(h, l, c, n=9) {
  const K = [], D = [], J = []; let pk = 50, pd = 50;
  for (let i = 0; i < c.length; i++) {
    const s = Math.max(0, i - n + 1);
    const hh = Math.max(...h.slice(s, i + 1)), ll = Math.min(...l.slice(s, i + 1));
    const rsv = hh === ll ? 50 : (c[i] - ll) / (hh - ll) * 100;
    pk = pk * 2 / 3 + rsv / 3; pd = pd * 2 / 3 + pk / 3;
    K.push(pk); D.push(pd); J.push(3 * pk - 2 * pd);
  }
  return {K, D, J};
}
function ema(a, n) {
  const out = []; const k = 2 / (n + 1); let prev = null;
  for (let i = 0; i < a.length; i++) { prev = prev == null ? a[i] : a[i] * k + prev * (1 - k); out.push(prev); }
  return out;
}
function rsi(c, n=14) {
  const out = new Array(c.length).fill(null); let g = 0, l = 0;
  for (let i = 1; i < c.length; i++) {
    const d = c[i] - c[i-1], up = Math.max(d, 0), dn = Math.max(-d, 0);
    if (i <= n) { g += up / n; l += dn / n; if (i < n) continue; }
    else { g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n; }
    out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  }
  return out;
}
function macd(c, f=12, s=26, sig=9) {
  const ef = ema(c, f), es = ema(c, s), dif = c.map((_, i) => ef[i] - es[i]), dea = ema(dif, sig);
  return {dif, dea, hist: dif.map((v, i) => (v - dea[i]) * 2)};
}
const crossUp = (a, b, i) => i > 0 && a[i-1] != null && b[i-1] != null && a[i] != null && b[i] != null && a[i-1] <= b[i-1] && a[i] > b[i];
const crossDn = (a, b, i) => i > 0 && a[i-1] != null && b[i-1] != null && a[i] != null && b[i] != null && a[i-1] >= b[i-1] && a[i] < b[i];

// 把逐日的法人持股對應到 K 棒（60 分：當日、週：該週最後一個交易日）
function mapDaily(bars, days, vals) {
  const out = new Array(bars.length).fill(null);
  if (!days.length) return out;
  let j = -1;
  for (let i = 0; i < bars.length; i++) {
    const agg = cfg.period === 'W' || cfg.period === 'M';
    const end = agg ? (i + 1 < bars.length ? bars[i+1].day : '9999') : bars[i].day;
    const strict = agg;
    while (j + 1 < days.length && (strict ? days[j+1] < end : days[j+1] <= end)) j++;
    if (j >= 0 && (agg || days[j] === bars[i].day)) out[i] = vals[j];
  }
  return out;
}

// ── 畫圖 ──
function line(color, width=1, extra={}) {
  return Object.assign({color, lineWidth: width, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false}, extra);
}
const toSeries = (bars, arr) => bars.map((b, i) => arr[i] == null ? {time: b.time} : {time: b.time, value: arr[i]});

function build() {
  const box = $('#chart');
  let range = null;
  if (chart) { range = chart.timeScale().getVisibleLogicalRange(); chart.remove(); }
  legendFns = [];
  document.querySelectorAll('.legend').forEach(e => e.remove());
  const bars = DATA.bars;
  if (!bars.length) { $('#loading').textContent = '查無 K 線資料'; $('#loading').style.display = 'flex'; return; }
  chart = LC.createChart(box, {
    autoSize: true,
    layout: {background: {color: Theme.css('--card-bg')}, textColor: Theme.css('--text-mid'), fontSize: 11, attributionLogo: false,
             fontFamily: "'JetBrains Mono', ui-monospace, monospace",
             panes: {separatorColor: Theme.css('--line'), separatorHoverColor: 'rgba(109,93,252,.3)'}},
    grid: {vertLines: {color: Theme.css('--grid')}, horzLines: {color: Theme.css('--grid')}},
    crosshair: {mode: LC.CrosshairMode.Normal, vertLine: {color: Theme.css('--text-dim'), labelBackgroundColor: Theme.css('--accent')}, horzLine: {color: Theme.css('--text-dim'), labelBackgroundColor: Theme.css('--accent')}},
    rightPriceScale: {borderColor: Theme.css('--line')},
    timeScale: {borderColor: Theme.css('--line'), timeVisible: INTRADAY.includes(cfg.period), secondsVisible: false, rightOffset: 4},
    handleScroll: {mouseWheel: cfg.wheel === 'zoom', pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false},
    handleScale: {mouseWheel: cfg.wheel === 'zoom', pinch: true, axisPressedMouseMove: true},
    localization: {locale: 'zh-TW', priceFormatter: p => Math.abs(p) >= 1000 ? p.toFixed(0) : p.toFixed(2)},
  });
  const O = bars.map(b => b.open), H = bars.map(b => b.high), L = bars.map(b => b.low), C = bars.map(b => b.close), V = bars.map(b => b.volume);
  const fmtTime = t => typeof t === 'number' ? new Date(t * 1000).toISOString().slice(0, 16).replace('T', ' ') : t;

  // 主圖
  const candle = chart.addSeries(LC.CandlestickSeries, {upColor: UP, downColor: DN, borderUpColor: UP, borderDownColor: DN, wickUpColor: UP, wickDownColor: DN, priceLineVisible: true});
  candle.setData(bars.map(b => ({time: b.time, open: b.open, high: b.high, low: b.low, close: b.close})));
  const maVals = {};
  MAS.forEach(([n, color]) => {
    if (!cfg.ma.includes(n)) return;
    maVals[n] = sma(C, n);
    chart.addSeries(LC.LineSeries, line(color)).setData(toSeries(bars, maVals[n]));
  });
  let bb = null;
  if (cfg.boll) {
    bb = boll(C);
    const o = {lineStyle: LC.LineStyle.Dashed};
    chart.addSeries(LC.LineSeries, line(Theme.css('--text-dim'), 1, o)).setData(toSeries(bars, bb.up));
    chart.addSeries(LC.LineSeries, line(Theme.css('--text-dim'), 1, {lineStyle: LC.LineStyle.Dotted})).setData(toSeries(bars, bb.mid));
    chart.addSeries(LC.LineSeries, line(Theme.css('--text-dim'), 1, o)).setData(toSeries(bars, bb.dn));
  }
  addLegend(0, i => {
    const b = bars[i], prev = i > 0 ? bars[i-1].close : b.open, cc = b.close >= prev ? 'up' : 'dn';
    return `<span class="n">${fmtTime(b.time)}</span>` +
      `<span>開 <b class="${cc}">${fmt(b.open)}</b></span><span>高 <b class="${cc}">${fmt(b.high)}</b></span>` +
      `<span>低 <b class="${cc}">${fmt(b.low)}</b></span><span>收 <b class="${cc}">${fmt(b.close)}</b></span>` +
      MAS.filter(([n]) => maVals[n]).map(([n, c]) => `<span style="color:${c}">MA${n} ${fmt(maVals[n][i])}</span>`).join('') +
      (bb ? `<span style="color:var(--text-mid)">BOLL ${fmt(bb.up[i])} / ${fmt(bb.mid[i])} / ${fmt(bb.dn[i])}</span>` : '');
  });

  // 副圖
  let paneIdx = 0, kd = null;
  const markers = [];
  const inst = DATA.inst;
  for (const [key, label] of PANES) {
    if (!cfg.panes.includes(key)) continue;
    paneIdx++;
    const p = paneIdx;
    if (key === 'vol') {
      const vs = chart.addSeries(LC.HistogramSeries, {priceFormat: {type: 'volume'}, priceLineVisible: false, lastValueVisible: true}, p);
      vs.setData(bars.map((b, i) => ({time: b.time, value: b.volume, color: (b.close >= (i ? bars[i-1].close : b.open)) ? alpha(UP, .55) : alpha(DN, .55)})));
      const v5 = sma(V, 5), v20 = sma(V, 20);
      chart.addSeries(LC.LineSeries, line(KDJ_C[0]), p).setData(toSeries(bars, v5));
      chart.addSeries(LC.LineSeries, line(KDJ_C[1]), p).setData(toSeries(bars, v20));
      addLegend(p, i => `<span class="n">${IS_INDEX() ? '成交金額(億)' : '成交量(張)'}</span><span>${fmt(V[i], 0)}</span><span style="color:${KDJ_C[0]}">MA5 ${fmt(v5[i], 0)}</span><span style="color:${KDJ_C[1]}">MA20 ${fmt(v20[i], 0)}</span>`);
    } else if (key === 'rsi') {
      const r = rsi(C);
      const rs = chart.addSeries(LC.LineSeries, line(KDJ_C[2], 1.5), p);
      rs.setData(toSeries(bars, r));
      rs.createPriceLine({price: 70, color: alpha(UP, .35), lineStyle: LC.LineStyle.Dashed, axisLabelVisible: false});
      rs.createPriceLine({price: 30, color: alpha(DN, .35), lineStyle: LC.LineStyle.Dashed, axisLabelVisible: false});
      addLegend(p, i => `<span class="n">RSI(14)</span><span style="color:${KDJ_C[2]}">${fmt(r[i])}</span>`);
    } else if (key === 'macd') {
      const m = macd(C);
      chart.addSeries(LC.HistogramSeries, {priceLineVisible: false, lastValueVisible: false}, p)
        .setData(bars.map((b, i) => ({time: b.time, value: m.hist[i], color: m.hist[i] >= 0 ? alpha(UP, .55) : alpha(DN, .55)})));
      chart.addSeries(LC.LineSeries, line(KDJ_C[1], 1.5), p).setData(toSeries(bars, m.dif));
      chart.addSeries(LC.LineSeries, line(KDJ_C[0], 1.5), p).setData(toSeries(bars, m.dea));
      addLegend(p, i => `<span class="n">MACD(12,26,9)</span><span style="color:${KDJ_C[1]}">DIF ${fmt(m.dif[i])}</span><span style="color:${KDJ_C[0]}">DEA ${fmt(m.dea[i])}</span><span class="${m.hist[i] >= 0 ? 'up' : 'dn'}">OSC ${fmt(m.hist[i])}</span>`);
    } else if (key === 'kdj') {
      kd = kd || kdj(H, L, C);
      chart.addSeries(LC.LineSeries, line(KDJ_C[0], 1.5), p).setData(toSeries(bars, kd.K));
      chart.addSeries(LC.LineSeries, line(KDJ_C[1], 1.5), p).setData(toSeries(bars, kd.D));
      const js = chart.addSeries(LC.LineSeries, line(KDJ_C[2]), p);
      js.setData(toSeries(bars, kd.J));
      js.createPriceLine({price: 80, color: alpha(UP, .35), lineStyle: LC.LineStyle.Dashed, axisLabelVisible: false});
      js.createPriceLine({price: 20, color: alpha(DN, .35), lineStyle: LC.LineStyle.Dashed, axisLabelVisible: false});
      addLegend(p, i => `<span class="n">KDJ(9,3,3)</span><span style="color:${KDJ_C[0]}">K ${fmt(kd.K[i])}</span><span style="color:${KDJ_C[1]}">D ${fmt(kd.D[i])}</span><span style="color:${KDJ_C[2]}">J ${fmt(kd.J[i])}</span>`);
    } else {
      const hold = inst.hold[key], maDaily = sma(hold, cfg.holdN);
      const h = mapDaily(bars, inst.days, hold), m = mapDaily(bars, inst.days, maDaily), net = mapDaily(bars, inst.days, inst.net[key]);
      const color = HOLD_COLOR[key];
      chart.addSeries(LC.HistogramSeries, {priceScaleId: 'net' + key, priceLineVisible: false, lastValueVisible: false}, p)
        .setData(bars.map((b, i) => net[i] == null || !['D', ...INTRADAY].includes(cfg.period) ? {time: b.time} : {time: b.time, value: net[i], color: net[i] >= 0 ? alpha(UP, .22) : alpha(DN, .22)}));
      chart.priceScale('net' + key, p).applyOptions({scaleMargins: {top: 0.55, bottom: 0}, visible: false});
      chart.addSeries(LC.LineSeries, line(color, 2, {lastValueVisible: true, priceFormat: {type: 'volume'}}), p).setData(toSeries(bars, h));
      chart.addSeries(LC.LineSeries, line(Theme.css('--text-mid'), 1, {lineStyle: LC.LineStyle.Dashed, priceFormat: {type: 'volume'}}), p).setData(toSeries(bars, m));
      const idx = IS_INDEX(), unit = idx ? '億' : '張', dp = idx ? 1 : 0;
      const nm = idx ? label.replace('持股', '') + '累計買賣超' : key === 'foreign' && !inst.foreign_anchor ? label + '(累計買賣超)' : label;
      addLegend(p, i => `<span class="n">${nm}(${unit})</span><span style="color:${color}">${fmt(h[i], dp)}</span><span>MA${cfg.holdN} ${fmt(m[i], dp)}</span>` +
        (net[i] != null && ['D', ...INTRADAY].includes(cfg.period) ? `<span class="${net[i] >= 0 ? 'up' : 'dn'}">當日 ${net[i] >= 0 ? '+' : ''}${fmt(net[i], dp)}${idx ? '億' : ''}</span>` : ''));
      // 盤後選股訊號：持股線穿越持股均線（日線）
      if (cfg.signals && cfg.period === 'D') {
        for (let i = 1; i < bars.length; i++) {
          if (crossUp(h, m, i))
            markers.push({time: bars[i].time, position: 'belowBar', color: UP, shape: 'arrowUp', text: label.slice(0, 2) + 'B'});
          else if (crossDn(h, m, i))
            markers.push({time: bars[i].time, position: 'aboveBar', color: DN, shape: 'arrowDown', text: label.slice(0, 2) + 'S'});
        }
      }
    }
  }
  if (markers.length) {
    markers.sort((a, b) => (a.time > b.time) - (a.time < b.time));
    LC.createSeriesMarkers(candle, markers);
  }

  // 版面：主圖較高，副圖平均
  const panes = chart.panes();
  panes.forEach((pn, i) => pn.setStretchFactor(i === 0 ? Math.max(2, panes.length * 0.9) : 1));

  const n = bars.length;
  if (range && cfg._keepRange) chart.timeScale().setVisibleLogicalRange(range);
  else chart.timeScale().setVisibleLogicalRange({from: Math.max(0, n - cfg.bars), to: n + 3});
  cfg._keepRange = false;
  chart.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (r) { cfg.bars = Math.max(20, Math.round(r.to - r.from - 3)); saveCfg(); }
  });
  chart.subscribeCrosshairMove(param => {
    const i = param.logical != null && param.time != null ? Math.round(param.logical) : n - 1;
    showLegend(Math.min(n - 1, Math.max(0, i)));
  });
  requestAnimationFrame(() => { placeLegends(); showLegend(n - 1); });
}

function addLegend(pane, fn) {
  const el = document.createElement('div');
  el.className = 'legend'; el.dataset.pane = pane;
  $('#box').appendChild(el);
  legendFns.push([el, fn]);
}
function showLegend(i) { legendFns.forEach(([el, fn]) => el.innerHTML = fn(i)); }
function placeLegends() {
  if (!chart) return;
  const top0 = $('#box').getBoundingClientRect().top;
  const panes = chart.panes();
  legendFns.forEach(([el]) => {
    const pe = panes[+el.dataset.pane]?.getHTMLElement();
    if (pe) el.style.top = (pe.getBoundingClientRect().top - top0 + 4) + 'px';
  });
}
new ResizeObserver(() => requestAnimationFrame(placeLegends)).observe($('#box'));
document.addEventListener('mouseup', () => setTimeout(placeLegends, 30));   // 拖曳副圖分隔線後

// ── 資料 ──
function fetchChart(c) {
  const key = c + ':' + cfg.period;
  if (!cache.has(key)) {
    const p = api(`/api/tw/board/chart/${encodeURIComponent(c)}?period=${cfg.period}`);
    p.catch(() => cache.delete(key));
    cache.set(key, p);
    if (cache.size > 40) cache.delete(cache.keys().next().value);
  }
  return cache.get(key);
}

let loadSeq = 0;
async function load() {
  const seq = ++loadSeq;
  renderTools();
  $('#loading').textContent = '載入中…'; $('#loading').style.display = 'flex';
  if (!EMBED) history.replaceState(null, '', '/tw/board/chart?code=' + encodeURIComponent(code));
  renderNav();
  loadQuote();
  try {
    const d = await fetchChart(code);
    if (seq !== loadSeq) return;
    DATA = d;
    document.title = `${d.code} ${d.name} — 技術分析`;
    $('#srcNote').textContent = d.source === 'db' ? '（K 線來源：證交所／櫃買中心日資料）' : '';
    build();
    $('#loading').style.display = 'none';
  } catch (e) {
    if (seq !== loadSeq) return;
    $('#loading').textContent = '載入失敗：' + e.message;
  }
  // 預先載入下一檔，讓連續瀏覽更順
  const ix = navIndex();
  if (ix >= 0 && ix + 1 < nav.list.length) fetchChart(nav.list[ix + 1][0]).catch(() => {});
}

let quoteTimer = null;
async function loadQuote() {
  clearTimeout(quoteTimer);
  const c = code;
  try {
    const q = await api('/api/tw/board/quote/' + encodeURIComponent(c));
    if (c !== code) return;
    const cc = q.chg > 0 ? 'up' : q.chg < 0 ? 'dn' : '';
    const metaTxt = q.kind === 'index' ? (q.market === 'TSE' ? '證交所' : '櫃買中心') + '・大盤指數' : (q.market === 'TSE' ? '上市' : '上櫃') + '・' + (q.industry || '');
    $('#title').innerHTML = `<div class="code">${esc(q.code)}<span class="meta">${esc(metaTxt)}</span></div><div class="name">${esc(q.name)}</div>`;
    $('#star').style.visibility = q.kind === 'index' ? 'hidden' : '';
    const ent = nav && nav.list.find(x => x[0] === q.code);
    if (ent && ent[1] === ent[0]) { ent[1] = q.name; $('#sideList').dataset.key = ''; renderNav(); }
    $('#px').className = 'px ' + cc; $('#px').textContent = fmt(q.price);
    $('#chg').className = 'chg ' + cc;
    $('#chg').innerHTML = q.chg == null ? '' : `<span class="pill">${q.chg > 0 ? '▲' : q.chg < 0 ? '▼' : ''}${fmt(Math.abs(q.chg))}</span><span class="pill">${q.chg_pct > 0 ? '+' : ''}${fmt(q.chg_pct)}%</span>`;
    $('#ohlc').innerHTML = `<span>開<b>${fmt(q.open)}</b></span><span>高<b>${fmt(q.high)}</b></span><span>低<b>${fmt(q.low)}</b></span>` +
      `<span>昨收<b>${fmt(q.prev)}</b></span><span>${q.kind === 'index' ? '金額' : '量'}<b>${fmt(q.volume, 0)}${q.kind === 'index' ? '億' : ''}</b></span>` +
      `<span>${q.realtime ? '<span class="rtflag"><i></i>LIVE ' + esc(q.time || '') + '</span>' : '<b style="margin:0;color:var(--text-dim)">' + esc(q.date || '') + '</b>'}</span>`;
    if (q.realtime) quoteTimer = setTimeout(loadQuote, 20000);
  } catch (e) {
    $('#title').innerHTML = `<div class="code">${esc(code)}</div><div class="name">-</div>`;
  }
}

// ── 清單 / 換股 ──
function navIndex() { return nav ? nav.list.findIndex(x => x[0] === code) : -1; }
function renderNav() {
  if (!nav || navIndex() < 0) {
    const g = WGROUPS.find(g => g.codes.includes(code)) || WGROUPS.find(g => g.codes.length) || {name: '自選股', codes: []};
    nav = {label: g.name, list: g.codes.map(c => [c, WNAMES[c] || c])};
    if (navIndex() < 0) nav.list.unshift([code, code]);
  }
  const ix = navIndex();
  $('#pos').textContent = `${ix + 1} / ${nav.list.length}`;
  $('#listLabel').textContent = nav.label; $('#listCount').textContent = nav.list.length;
  $('#prev').disabled = ix <= 0; $('#next').disabled = ix >= nav.list.length - 1;
  const wset = new Set(WATCH);
  $('#star').innerHTML = `<svg viewBox="0 0 24 24" fill="${wset.has(code) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>`; $('#star').classList.toggle('on', wset.has(code));
  const sl = $('#sideList');
  if (sl.dataset.key !== nav.label + nav.list.length) {
    sl.dataset.key = nav.label + nav.list.length;
    sl.innerHTML = nav.list.map(([c, n]) => `<div class="side-item" data-c="${esc(c)}"><span class="c">${esc(c)}</span><span class="n">${esc(n)}</span></div>`).join('');
  }
  sl.querySelectorAll('.side-item.cur').forEach(e => e.classList.remove('cur'));
  const cur = sl.querySelector(`[data-c="${CSS.escape(code)}"]`);
  if (cur) { cur.classList.add('cur'); cur.scrollIntoView({block: 'nearest'}); }
}
function go(step) {
  const ix = navIndex(), j = ix + step;
  if (ix < 0 || j < 0 || j >= nav.list.length) return;
  code = nav.list[j][0];
  load();
}
$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#sideList').onclick = e => { const it = e.target.closest('.side-item'); if (it) { code = it.dataset.c; load(); } };

let wheelAcc = 0, wheelLock = 0;
$('#box').addEventListener('wheel', e => {
  if (cfg.wheel !== 'switch') return;
  e.preventDefault();
  if (Date.now() < wheelLock) return;
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) >= 60) { go(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; wheelLock = Date.now() + 250; }
}, {passive: false});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (EMBED && !['+', '=', '-'].includes(e.key)) return;   // 嵌入時不換股、不離開頁面
  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  else if (e.key === 'Escape') location.href = '/tw/board';
  else if ((e.key === '+' || e.key === '=' || e.key === '-') && chart) {
    const ts = chart.timeScale(), r = ts.getVisibleLogicalRange(); if (!r) return;
    const w = r.to - r.from, nw = e.key === '-' ? w * 1.25 : w * 0.8;
    ts.setVisibleLogicalRange({from: r.to - nw, to: r.to});
  }
});

$('#star').onclick = async () => {
  const on = WATCH.includes(code);
  // 從清單頁的某個群組進來，就加到那個群組；否則加到第一個群組
  const group = WGROUPS.some(g => g.name === nav?.label) ? nav.label : undefined;
  setWatch(await api('/api/tw/board/watchlist', {method: on ? 'DELETE' : 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({code, group})}));
  renderNav();
};

// ── 工具列 ──
function renderTools() {
  document.querySelectorAll('[data-period]').forEach(b => b.classList.toggle('on', b.dataset.period === cfg.period));
  document.querySelectorAll('[data-wheel]').forEach(b => b.classList.toggle('on', b.dataset.wheel === cfg.wheel));
  $('#maToggles').innerHTML = '<b>均線</b>' + MAS.map(([n, c]) => `<span class="tg${cfg.ma.includes(n) ? ' on' : ''}" data-ma="${n}"><i style="background:${c}"></i>MA${n}</span>`).join('');
  $('#mainToggles').innerHTML = `<span class="tg${cfg.boll ? ' on' : ''}" data-flag="boll"><i style="background:var(--text-dim)"></i>布林</span>` +
    `<span class="tg${cfg.signals ? ' on' : ''}" data-flag="signals" title="在日 K 上標示：法人持股線穿越持股均線">選股訊號</span>`;
  $('#paneToggles').innerHTML = '<b>副圖</b>' + PANES.map(([k, l]) => `<span class="tg${cfg.panes.includes(k) ? ' on' : ''}" data-pane="${k}">${HOLD_COLOR[k] ? `<i style="background:${HOLD_COLOR[k]}"></i>` : ''}${IS_INDEX() ? l.replace('持股', '買賣超') : l}</span>`).join('');
  $('#holdN').value = cfg.holdN;
}
document.querySelector('.tools').addEventListener('click', e => {
  const t = e.target.closest('[data-period],[data-wheel],[data-ma],[data-flag],[data-pane]');
  if (!t) return;
  if (t.dataset.period) { cfg.period = t.dataset.period; saveCfg(); renderTools(); return load(); }
  if (t.dataset.wheel) { cfg.wheel = t.dataset.wheel; }
  if (t.dataset.ma) { const n = +t.dataset.ma; cfg.ma = cfg.ma.includes(n) ? cfg.ma.filter(x => x !== n) : cfg.ma.concat(n); }
  if (t.dataset.flag) cfg[t.dataset.flag] = !cfg[t.dataset.flag];
  if (t.dataset.pane) { const k = t.dataset.pane; cfg.panes = cfg.panes.includes(k) ? cfg.panes.filter(x => x !== k) : PANES.map(p => p[0]).filter(x => x === k || cfg.panes.includes(x)); }
  saveCfg(); renderTools();
  if (DATA) { cfg._keepRange = true; build(); }
});
$('#holdN').onchange = e => {
  cfg.holdN = Math.max(2, Math.min(60, +e.target.value || 5)); saveCfg(); renderTools();
  if (DATA) { cfg._keepRange = true; build(); }
};

window.addEventListener('themechange', () => { themeColors(); renderTools(); if (DATA) { cfg._keepRange = true; build(); } });

(async () => {
  renderTools();
  try { setWatch(await api('/api/tw/board/watchlist')); } catch (e) {}
  load();
})();
</script>
</body>
</html>
