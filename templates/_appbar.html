{%- set p = request.path -%}
<header class="appbar">
  <a class="appbar-brand" href="/tw/board">
    <span class="appbar-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></svg></span>
    <span class="appbar-name">Stock<b>Lens</b></span>
  </a>
  <nav class="appbar-links">
    <a class="appbar-link{{ ' active' if p.startswith('/tw/board') }}" href="/tw/board">台股看盤</a>
    <a class="appbar-link{{ ' active' if p == '/tw' }}" href="/tw">台股分析</a>
    <a class="appbar-link{{ ' active' if p == '/' }}" href="/">美股分析</a>
    <a class="appbar-link{{ ' active' if p.startswith('/screener') }}" href="/screener">策略選股</a>
    <a class="appbar-link{{ ' active' if p.startswith('/portfolio') }}" href="/portfolio">投資組合</a>
  </nav>
  <div class="appbar-right">
    <span class="mkt-chip" id="mktChip"><i></i><span>台股</span><b class="num"></b></span>
    <button class="icon-btn theme-toggle" data-theme-toggle title="切換亮色 / 暗色" aria-label="切換亮色 / 暗色">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    {% if session.get('user') %}
    <span class="user-chip"><span class="user-avatar">{{ session['user'][:1]|upper }}</span><span class="user-name">{{ session['user'] }}</span></span>
    <a class="appbar-logout" href="/logout">登出</a>
    {% endif %}
  </div>
</header>
