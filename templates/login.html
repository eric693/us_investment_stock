<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockLens — 登入</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07111f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .card {
      background: #0d1e30;
      border: 1px solid #1a2e44;
      border-radius: 16px;
      padding: 44px 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #e8f4ff;
      letter-spacing: -0.5px;
    }
    .logo-accent { color: #3b9eff; }
    .logo-sub {
      font-size: 0.78rem;
      color: #4a6580;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }
    label {
      display: block;
      font-size: 0.78rem;
      color: #4a6580;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: #0a1624;
      border: 1px solid #1a2e44;
      border-radius: 8px;
      color: #e8f4ff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus {
      border-color: #3b9eff;
    }
    .error {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #f04a4a;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 13px;
      background: #3b9eff;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2a8af0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-title">Stock<span class="logo-accent">Lens</span></div>
      <div class="logo-sub">美股 · 台股智能分析平台</div>
    </div>
    <form method="POST">
      <label for="password">存取密碼</label>
      <input type="password" id="password" name="password" placeholder="請輸入密碼" autofocus>
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
      <button type="submit">進入</button>
    </form>
  </div>
</body>
</html>
